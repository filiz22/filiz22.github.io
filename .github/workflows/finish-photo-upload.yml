name: Finish Portfolio Upload

on: [push]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack portfolio photos
        run: |
          unzip -o "assets/fizzy-portfolio-new-photos-14-24 (2).zip" -d assets
          rm "assets/fizzy-portfolio-new-photos-14-24 (2).zip"

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add portfolio photos 14 through 24"
          git push
