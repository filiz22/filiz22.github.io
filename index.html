<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fizzy Portfolio — Photography by Filiz Sonmez">
  <title>Fizzy Portfolio</title>

  <style>
    :root{
      --burgundy:#3b0719;
      --cream:#f6ecdf;
      --number:#3f2357;
      --dark:#191919;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:#fff;
      color:var(--dark);
      font-family:Arial, Helvetica, sans-serif;
    }

    button{font:inherit}

    .hero{
      min-height:430px;
      color:var(--cream);
      background:var(--burgundy);
      padding:70px 28px 54px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:url("assets/bg.jpg");
      background-size:520px auto;
      background-repeat:repeat-x;
      background-position:center 26%;
      opacity:.82;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        90deg,
        rgba(52,5,22,.48),
        rgba(52,5,22,.30) 48%,
        rgba(52,5,22,.46)
      );
    }

    .hero-inner{
      width:min(1480px,100%);
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .hero h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(70px,9vw,145px);
      line-height:.9;
      font-weight:400;
      letter-spacing:-.055em;
    }

    .hero p{
      margin:26px 0 0;
      font-size:14px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .gallery-section{
      background:#fff;
      padding:22px 22px 56px;
    }

    .gallery{
      width:min(1480px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      align-items:start;
    }

    .gallery-column{
      display:flex;
      flex-direction:column;
      gap:14px;
      min-width:0;
    }

    .photo{
      margin:0;
      min-width:0;
    }

    .symbol{
      display:block;
      margin:0 0 8px;
      color:var(--number);
      text-align:center;
      line-height:1;
      font-weight:700;
    }

    .symbol.peace{
      font-family:Arial, Helvetica, sans-serif;
      font-size:38px;
    }

    .symbol.heart{
      font-family:Arial, Helvetica, sans-serif;
      font-size:36px;
    }

    .symbol.amp{
      font-family:Georgia, "Times New Roman", serif;
      font-size:42px;
      font-style:italic;
    }

    .symbol.note{
      font-family:Arial, Helvetica, sans-serif;
      font-size:40px;
    }

    .photo button{
      width:100%;
      display:block;
      border:0;
      padding:0;
      background:none;
      cursor:zoom-in;
    }

    .photo img{
      display:block;
      width:100%;
      height:auto;
      background:#eee;
      transition:opacity .18s ease, transform .18s ease;
    }

    .photo button:hover img{
      opacity:.94;
      transform:scale(.997);
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:58px 72px;
      background:rgba(9,2,5,.96);
    }

    .lightbox.open{display:flex}

    .lightbox img{
      display:block;
      max-width:100%;
      max-height:calc(100vh - 116px);
      object-fit:contain;
    }

    .close,
    .prev,
    .next{
      position:absolute;
      border:0;
      background:transparent;
      color:#fff;
      cursor:pointer;
      z-index:2;
    }

    .close{
      top:18px;
      right:24px;
      font-size:38px;
      line-height:1;
    }

    .prev,
    .next{
      top:50%;
      transform:translateY(-50%);
      font-size:46px;
      padding:16px;
    }

    .prev{left:6px}
    .next{right:6px}

    .lightbox-num{
      position:absolute;
      left:24px;
      top:22px;
      color:#fff;
      font-family:Georgia, "Times New Roman", serif;
      font-size:18px;
    }

    @media (max-width:950px){
      .gallery{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:620px){
      .hero{
        min-height:300px;
        padding:48px 18px 38px;
      }

      .hero::before{
        background-size:390px auto;
      }

      .hero h1{
        font-size:clamp(58px,20vw,92px);
      }

      .hero p{
        font-size:11px;
      }

      .gallery-section{
        padding:18px 12px 42px;
      }

      .gallery{
        grid-template-columns:1fr;
        gap:12px;
      }

      .gallery-column{
        gap:12px;
      }

      .lightbox{
        padding:56px 14px;
      }

      .prev,.next{
        font-size:36px;
        padding:8px;
      }

      .prev{left:0}
      .next{right:0}
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>Fizzy Portfolio</h1>
      <p>Photography by Filiz Sonmez</p>
    </div>
  </header>

  <main class="gallery-section">
    <div class="gallery" id="gallery">

      <figure class="photo" data-index="0">
        <span class="symbol peace">☮</span>
        <button aria-label="Enlarge photo 01">
          <img src="assets/01.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="1">
        <span class="symbol heart">♥</span>
        <button aria-label="Enlarge photo 02">
          <img src="assets/02.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="2">
        <span class="symbol amp">&amp;</span>
        <button aria-label="Enlarge photo 03">
          <img src="assets/03.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="3">
        <span class="symbol note">♪</span>
        <button aria-label="Enlarge photo 04">
          <img src="assets/04.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="4">
        <span class="symbol peace">☮</span>
        <button aria-label="Enlarge photo 05">
          <img src="assets/05.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="5">
        <span class="symbol heart">♥</span>
        <button aria-label="Enlarge photo 06">
          <img src="assets/06.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="6">
        <span class="symbol amp">&amp;</span>
        <button aria-label="Enlarge photo 07">
          <img src="assets/07.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="7">
        <span class="symbol note">♪</span>
        <button aria-label="Enlarge photo 08">
          <img src="assets/08.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="8">
        <span class="symbol peace">☮</span>
        <button aria-label="Enlarge photo 09">
          <img src="assets/09.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="9">
        <span class="symbol heart">♥</span>
        <button aria-label="Enlarge photo 10">
          <img src="assets/10.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="10">
        <span class="symbol amp">&amp;</span>
        <button aria-label="Enlarge photo 11">
          <img src="assets/11.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="11">
        <span class="symbol note">♪</span>
        <button aria-label="Enlarge photo 12">
          <img src="assets/12.jpg" alt="">
        </button>
      </figure>

      <figure class="photo" data-index="12">
        <span class="symbol peace">☮</span>
        <button aria-label="Enlarge photo 13">
          <img src="assets/13.jpg" alt="">
        </button>
      </figure>

    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-num" id="lightboxNum">01</span>

    <button class="close" id="close">×</button>

    <button class="prev" id="prev">‹</button>

    <img id="lightboxImage" alt="">

    <button class="next" id="next">›</button>
  </div>

  <script>
    const gallery = document.getElementById('gallery');

    const photos =
      Array.from(gallery.querySelectorAll('.photo'));

    const files =
      Array.from(
        {length:13},
        (_,i) =>
          'assets/' +
          String(i + 1).padStart(2,'0') +
          '.jpg'
      );

    function columnCount(){
      if(window.innerWidth <= 620) return 1;

      if(window.innerWidth <= 950) return 2;

      return 3;
    }

    function arrangeGallery(){

      const count = columnCount();

      gallery.innerHTML = '';

      const columns =
        Array.from(
          {length:count},
          () => {

            const column =
              document.createElement('div');

            column.className =
              'gallery-column';

            gallery.appendChild(column);

            return column;
          }
        );

      photos.forEach((photo,i) => {

        columns[i % count]
          .appendChild(photo);

      });

    }

    arrangeGallery();

    window.addEventListener(
      'resize',
      arrangeGallery
    );

    const box =
      document.getElementById('lightbox');

    const image =
      document.getElementById('lightboxImage');

    const number =
      document.getElementById('lightboxNum');

    let current = 0;

    function openPhoto(index){

      current =
        (index + files.length)
        % files.length;

      image.src =
        files[current];

      number.textContent =
        String(current + 1)
        .padStart(2,'0');

      box.classList.add('open');

      document.body.style.overflow =
        'hidden';
    }

    function closePhoto(){

      box.classList.remove('open');

      image.src = '';

      document.body.style.overflow = '';
    }

    photos.forEach(photo => {

      photo
        .querySelector('button')
        .addEventListener(
          'click',
          () => {

            openPhoto(
              Number(photo.dataset.index)
            );

          }
        );

    });

    document
      .getElementById('close')
      .addEventListener(
        'click',
        closePhoto
      );

    document
      .getElementById('prev')
      .addEventListener(
        'click',
        () =>
          openPhoto(current - 1)
      );

    document
      .getElementById('next')
      .addEventListener(
        'click',
        () =>
          openPhoto(current + 1)
      );

    box.addEventListener(
      'click',
      event => {

        if(event.target === box)
          closePhoto();

      }
    );

    document.addEventListener(
      'keydown',
      event => {

        if(
          !box.classList
            .contains('open')
        ) return;

        if(event.key === 'Escape')
          closePhoto();

        if(event.key === 'ArrowLeft')
          openPhoto(current - 1);

        if(event.key === 'ArrowRight')
          openPhoto(current + 1);

      }
    );
  </script>

</body>
</html>
