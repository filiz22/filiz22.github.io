<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fizzy Portfolio — Photography by Filiz Sonmez">
  <title>Fizzy Portfolio</title>
  <style>
    :root{
      --cream:#f4eadc;
      --cream-soft:#dfd0c0;
      --wine:#3b0b1d;
      --line:rgba(244,234,220,.32);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--cream);
      background:
        linear-gradient(rgba(49,8,24,.84),rgba(49,8,24,.90)),
        url("assets/bg.jpg") center top / cover fixed;
    }

    .page{
      width:min(1220px,calc(100% - 36px));
      margin:0 auto;
    }

    header{
      padding:64px 0 42px;
      border-bottom:1px solid var(--line);
      margin-bottom:26px;
    }

    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(52px,8vw,104px);
      line-height:.95;
      font-weight:400;
      letter-spacing:-.045em;
    }

    .byline{
      margin:16px 0 0;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:11px;
      color:var(--cream-soft);
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      grid-auto-rows:8px;
      gap:0 16px;
      padding-bottom:56px;
    }

    .photo{
      margin:0;
      padding:0 0 16px;
      min-width:0;
    }

    .num{
      display:block;
      padding:0 0 8px;
      margin:0 0 8px;
      border-bottom:1px solid var(--line);
      font-family:Georgia,"Times New Roman",serif;
      font-size:15px;
      line-height:1;
      letter-spacing:.04em;
    }

    .photo button{
      display:block;
      width:100%;
      padding:0;
      border:0;
      background:transparent;
      cursor:zoom-in;
    }

    .photo img{
      display:block;
      width:100%;
      height:auto;
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:46px 64px;
      background:rgba(15,2,8,.96);
    }

    .lightbox.open{display:flex}

    .lightbox img{
      display:block;
      max-width:100%;
      max-height:calc(100vh - 92px);
      object-fit:contain;
    }

    .close{
      position:absolute;
      top:16px;
      right:22px;
      border:0;
      background:none;
      color:var(--cream);
      font-size:36px;
      line-height:1;
      cursor:pointer;
    }

    @media(max-width:850px){
      .gallery{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:0 12px;
      }
      header{padding-top:48px}
    }

    @media(max-width:540px){
      .page{width:min(100% - 20px,1220px)}
      .gallery{
        grid-template-columns:1fr;
        display:block;
      }
      .photo{padding-bottom:18px}
      .lightbox{padding:52px 12px 18px}
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Fizzy Portfolio</h1>
      <p class="byline">Photography by Filiz Sonmez</p>
    </header>

    <main class="gallery" id="gallery">
      <figure class="photo"><span class="num">01</span><button aria-label="Enlarge photo 01"><img src="assets/01.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">02</span><button aria-label="Enlarge photo 02"><img src="assets/02.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">03</span><button aria-label="Enlarge photo 03"><img src="assets/03.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">04</span><button aria-label="Enlarge photo 04"><img src="assets/04.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">05</span><button aria-label="Enlarge photo 05"><img src="assets/05.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">06</span><button aria-label="Enlarge photo 06"><img src="assets/06.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">07</span><button aria-label="Enlarge photo 07"><img src="assets/07.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">08</span><button aria-label="Enlarge photo 08"><img src="assets/08.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">09</span><button aria-label="Enlarge photo 09"><img src="assets/09.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">10</span><button aria-label="Enlarge photo 10"><img src="assets/10.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">11</span><button aria-label="Enlarge photo 11"><img src="assets/11.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">12</span><button aria-label="Enlarge photo 12"><img src="assets/12.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">13</span><button aria-label="Enlarge photo 13"><img src="assets/13.jpg" alt=""></button></figure>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="close" id="close" aria-label="Close">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const cards = [...document.querySelectorAll('.photo')];

    function resizeMasonryItem(item){
      if (window.innerWidth <= 540) {
        item.style.gridRowEnd = '';
        return;
      }
      const styles = getComputedStyle(gallery);
      const row = parseInt(styles.getPropertyValue('grid-auto-rows'));
      const gap = parseInt(styles.getPropertyValue('row-gap')) || 0;
      const height = item.getBoundingClientRect().height;
      const span = Math.ceil((height + gap) / (row + gap));
      item.style.gridRowEnd = 'span ' + span;
    }

    function resizeAll(){
      cards.forEach(resizeMasonryItem);
    }

    document.querySelectorAll('.photo img').forEach(img => {
      if (img.complete) {
        requestAnimationFrame(resizeAll);
      } else {
        img.addEventListener('load', resizeAll, {once:true});
      }
    });

    window.addEventListener('resize', resizeAll);
    window.addEventListener('load', resizeAll);

    const box = document.getElementById('lightbox');
    const boxImage = document.getElementById('lightboxImage');
    const close = document.getElementById('close');

    document.querySelectorAll('.photo img').forEach(img => {
      img.parentElement.addEventListener('click', () => {
        boxImage.src = img.src;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeBox(){
      box.classList.remove('open');
      boxImage.src = '';
      document.body.style.overflow = '';
    }

    close.addEventListener('click', closeBox);
    box.addEventListener('click', e => {
      if (e.target === box) closeBox();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeBox();
    });
  </script>
</body>
</html>
