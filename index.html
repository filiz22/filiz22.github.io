<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fizzy Portfolio — Photography by Filiz Sonmez">
  <title>Fizzy Portfolio</title>

  <style>
    :root{
      --burgundy:#3b0719;
      --cream:#f6ecdf;
      --number:#8e6caf;
      --dark:#191919;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:#fff;
      color:var(--dark);
      font-family:Arial, Helvetica, sans-serif;
    }

    button{font:inherit}

    .hero{
      min-height:430px;
      color:var(--cream);
      background:
        linear-gradient(rgba(52,5,22,.58),rgba(52,5,22,.70)),
        url("assets/bg.jpg") center/cover no-repeat;
      padding:70px 28px 54px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .hero-inner{
      width:min(1480px,100%);
      margin:0 auto;
    }

    .hero h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(70px,9vw,145px);
      line-height:.9;
      font-weight:400;
      letter-spacing:-.055em;
    }

    .hero p{
      margin:26px 0 0;
      font-size:14px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .gallery-section{
      background:#fff;
      padding:38px 28px 72px;
    }

    .gallery{
      width:min(1480px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:42px 28px;
      align-items:start;
    }

    .photo{
      margin:0;
      min-width:0;
    }

    .num{
      display:block;
      margin:0 0 10px;
      color:var(--number);
      font-family:Georgia, "Times New Roman", serif;
      font-size:19px;
      line-height:1;
      text-align:center;
    }

    .photo button{
      width:100%;
      display:block;
      border:0;
      padding:0;
      background:none;
      cursor:zoom-in;
    }

    .photo img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#eee;
      transition:opacity .18s ease, transform .18s ease;
    }

    .photo button:hover img{
      opacity:.94;
      transform:scale(.997);
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:58px 72px;
      background:rgba(9,2,5,.96);
    }

    .lightbox.open{display:flex}

    .lightbox img{
      display:block;
      max-width:100%;
      max-height:calc(100vh - 116px);
      object-fit:contain;
    }

    .close,
    .prev,
    .next{
      position:absolute;
      border:0;
      background:transparent;
      color:#fff;
      cursor:pointer;
      z-index:2;
    }

    .close{
      top:18px;
      right:24px;
      font-size:38px;
      line-height:1;
    }

    .prev,
    .next{
      top:50%;
      transform:translateY(-50%);
      font-size:46px;
      padding:16px;
    }

    .prev{left:6px}
    .next{right:6px}

    .lightbox-num{
      position:absolute;
      left:24px;
      top:22px;
      color:#fff;
      font-family:Georgia, "Times New Roman", serif;
      font-size:18px;
    }

    @media (max-width:950px){
      .gallery{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:620px){
      .hero{
        min-height:300px;
        padding:48px 18px 38px;
      }

      .hero h1{
        font-size:clamp(58px,20vw,92px);
      }

      .hero p{
        font-size:11px;
      }

      .gallery-section{
        padding:28px 14px 52px;
      }

      .gallery{
        grid-template-columns:1fr;
        gap:30px;
      }

      .photo img{
        aspect-ratio:auto;
      }

      .lightbox{
        padding:56px 14px;
      }

      .prev,.next{
        font-size:36px;
        padding:8px;
      }

      .prev{left:0}
      .next{right:0}
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>Fizzy Portfolio</h1>
      <p>Photography by Filiz Sonmez</p>
    </div>
  </header>

  <main class="gallery-section">
    <div class="gallery">
      <figure class="photo"><span class="num">01</span><button data-index="0" aria-label="Enlarge photo 01"><img src="assets/01.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">02</span><button data-index="1" aria-label="Enlarge photo 02"><img src="assets/02.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">03</span><button data-index="2" aria-label="Enlarge photo 03"><img src="assets/03.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">04</span><button data-index="3" aria-label="Enlarge photo 04"><img src="assets/04.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">05</span><button data-index="4" aria-label="Enlarge photo 05"><img src="assets/05.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">06</span><button data-index="5" aria-label="Enlarge photo 06"><img src="assets/06.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">07</span><button data-index="6" aria-label="Enlarge photo 07"><img src="assets/07.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">08</span><button data-index="7" aria-label="Enlarge photo 08"><img src="assets/08.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">09</span><button data-index="8" aria-label="Enlarge photo 09"><img src="assets/09.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">10</span><button data-index="9" aria-label="Enlarge photo 10"><img src="assets/10.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">11</span><button data-index="10" aria-label="Enlarge photo 11"><img src="assets/11.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">12</span><button data-index="11" aria-label="Enlarge photo 12"><img src="assets/12.jpg" alt=""></button></figure>
      <figure class="photo"><span class="num">13</span><button data-index="12" aria-label="Enlarge photo 13"><img src="assets/13.jpg" alt=""></button></figure>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <span class="lightbox-num" id="lightboxNum">01</span>
    <button class="close" id="close" aria-label="Close">×</button>
    <button class="prev" id="prev" aria-label="Previous photo">‹</button>
    <img id="lightboxImage" alt="">
    <button class="next" id="next" aria-label="Next photo">›</button>
  </div>

  <script>
    const files = Array.from({length:13}, (_,i) =>
      'assets/' + String(i + 1).padStart(2,'0') + '.jpg'
    );

    const box = document.getElementById('lightbox');
    const image = document.getElementById('lightboxImage');
    const number = document.getElementById('lightboxNum');
    let current = 0;

    function openPhoto(index){
      current = (index + files.length) % files.length;
      image.src = files[current];
      number.textContent = String(current + 1).padStart(2,'0');
      box.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePhoto(){
      box.classList.remove('open');
      image.src = '';
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.photo button').forEach(button => {
      button.addEventListener('click', () => openPhoto(Number(button.dataset.index)));
    });

    document.getElementById('close').addEventListener('click', closePhoto);
    document.getElementById('prev').addEventListener('click', () => openPhoto(current - 1));
    document.getElementById('next').addEventListener('click', () => openPhoto(current + 1));

    box.addEventListener('click', event => {
      if(event.target === box) closePhoto();
    });

    document.addEventListener('keydown', event => {
      if(!box.classList.contains('open')) return;
      if(event.key === 'Escape') closePhoto();
      if(event.key === 'ArrowLeft') openPhoto(current - 1);
      if(event.key === 'ArrowRight') openPhoto(current + 1);
    });
  </script>
</body>
</html>
