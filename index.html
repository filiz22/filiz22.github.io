<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fizzy Portfolio — Photography by Filiz Sonmez">
  <title>Fizzy Portfolio</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f7f4ef;
      color:#171717;
    }
    header{
      text-align:center;
      padding:70px 20px 44px;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(44px,7vw,82px);
      font-weight:400;
      letter-spacing:-.03em;
    }
    .byline{
      margin:14px 0 0;
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .gallery{
      width:min(1200px,calc(100% - 28px));
      margin:0 auto 40px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      align-items:start;
    }
    .gallery button{
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      cursor:zoom-in;
      display:block;
      width:100%;
    }
    .gallery img{
      display:block;
      width:100%;
      height:auto;
    }
    .lightbox{
      position:fixed;
      inset:0;
      z-index:999;
      background:rgba(0,0,0,.95);
      display:none;
      align-items:center;
      justify-content:center;
      padding:30px;
    }
    .lightbox.open{display:flex}
    .lightbox img{
      max-width:96vw;
      max-height:92vh;
      object-fit:contain;
    }
    .close{
      position:absolute;
      top:16px;
      right:22px;
      border:0;
      background:none;
      color:#fff;
      font-size:36px;
      cursor:pointer;
      line-height:1;
    }
    @media(max-width:800px){
      header{padding:48px 18px 32px}
      .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100% - 16px,1200px)}
    }
    @media(max-width:520px){
      .gallery{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <h1>Fizzy Portfolio</h1>
    <p class="byline">Photography by Filiz Sonmez</p>
  </header>

  <main class="gallery">
    <button><img src="assets/01.jpg" alt=""></button>
    <button><img src="assets/02.jpg" alt=""></button>
    <button><img src="assets/03.jpg" alt=""></button>
    <button><img src="assets/04.jpg" alt=""></button>
    <button><img src="assets/05.jpg" alt=""></button>
    <button><img src="assets/06.jpg" alt=""></button>
    <button><img src="assets/07.jpg" alt=""></button>
    <button><img src="assets/08.jpg" alt=""></button>
    <button><img src="assets/09.jpg" alt=""></button>
    <button><img src="assets/10.jpg" alt=""></button>
    <button><img src="assets/11.jpg" alt=""></button>
    <button><img src="assets/12.jpg" alt=""></button>
    <button><img src="assets/13.jpg" alt=""></button>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" id="close" aria-label="Close">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    const box = document.getElementById('lightbox');
    const boxImage = document.getElementById('lightboxImage');
    const close = document.getElementById('close');

    document.querySelectorAll('.gallery img').forEach(img => {
      img.parentElement.addEventListener('click', () => {
        boxImage.src = img.src;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeBox(){
      box.classList.remove('open');
      boxImage.src = '';
      document.body.style.overflow = '';
    }

    close.addEventListener('click', closeBox);
    box.addEventListener('click', e => {
      if (e.target === box) closeBox();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeBox();
    });
  </script>
</body>
</html>
