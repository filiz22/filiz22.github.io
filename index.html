<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fizzy Portfolio — Photography by Filiz Sonmez">
  <title>Fizzy Portfolio</title>

  <style>
    :root{
      --header-overlay: rgba(55, 10, 28, 0.58);
      --header-overlay-2: rgba(55, 10, 28, 0.72);
      --text-dark: #222;
      --purple-num: #9b79c8;
      --white: #ffffff;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--text-dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page{
      width:min(1500px, calc(100% - 40px));
      margin:20px auto 0;
    }

    .hero{
      background:
        linear-gradient(var(--header-overlay), var(--header-overlay-2)),
        url("assets/bg.jpg") center center / cover no-repeat;
      color:#fff;
      min-height:380px;
      position:relative;
      padding:22px 20px 40px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .hero-top{
      width:100%;
      max-width:260px;
    }

    .small-brand{
      font-size:18px;
      font-weight:300;
      margin:0 0 8px;
    }

    .hero-line{
      height:1px;
      background:rgba(255,255,255,.35);
      width:100%;
    }

    .hero-center{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px 10px 10px;
    }

    .hero-center h1{
      margin:0;
      font-weight:300;
      line-height:1;
      letter-spacing:.01em;
      font-size:clamp(54px, 8vw, 100px);
    }

    .hero-center p{
      margin:18px 0 0;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:12px;
    }

    .gallery-wrap{
      background:#fff;
      padding:28px 0 50px;
    }

    .gallery{
      width:min(1260px, calc(100% - 40px));
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      grid-auto-rows:8px;
      gap:0 32px;
      align-items:start;
    }

    .photo{
      margin:0;
      padding:0 0 26px;
    }

    .photo button{
      display:block;
      width:100%;
      padding:0;
      margin:0;
      border:0;
      background:none;
      cursor:zoom-in;
    }

    .photo img{
      display:block;
      width:100%;
      height:auto;
    }

    .num{
      display:block;
      text-align:center;
      margin-top:14px;
      font-size:17px;
      color:var(--purple-num);
      font-family: Georgia, "Times New Roman", serif;
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:999;
      background:rgba(0,0,0,.95);
      display:none;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .lightbox.open{
      display:flex;
    }

    .lightbox img{
      max-width:96vw;
      max-height:92vh;
      object-fit:contain;
    }

    .close{
      position:absolute;
      top:16px;
      right:22px;
      border:0;
      background:none;
      color:#fff;
      font-size:36px;
      cursor:pointer;
      line-height:1;
    }

    @media (max-width: 1000px){
      .gallery{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:0 20px;
      }
    }

    @media (max-width: 650px){
      .page{
        width:min(100% - 16px, 1500px);
        margin-top:8px;
      }

      .hero{
        min-height:280px;
        padding:18px 14px 28px;
      }

      .small-brand{
        font-size:16px;
      }

      .gallery{
        width:min(100% - 16px, 1260px);
        grid-template-columns:1fr;
        display:block;
      }

      .photo{
        padding-bottom:24px;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="hero">
      <div class="hero-top">
        <div class="small-brand">Fizzy Portfolio</div>
        <div class="hero-line"></div>
      </div>

      <div class="hero-center">
        <h1>Fizzy Portfolio</h1>
        <p>Photography by Filiz Sonmez</p>
      </div>
    </header>
  </div>

  <section class="gallery-wrap">
    <main class="gallery" id="gallery">
      <figure class="photo"><button><img src="assets/01.jpg" alt=""></button><span class="num">01</span></figure>
      <figure class="photo"><button><img src="assets/02.jpg" alt=""></button><span class="num">02</span></figure>
      <figure class="photo"><button><img src="assets/03.jpg" alt=""></button><span class="num">03</span></figure>
      <figure class="photo"><button><img src="assets/04.jpg" alt=""></button><span class="num">04</span></figure>
      <figure class="photo"><button><img src="assets/05.jpg" alt=""></button><span class="num">05</span></figure>
      <figure class="photo"><button><img src="assets/06.jpg" alt=""></button><span class="num">06</span></figure>
      <figure class="photo"><button><img src="assets/07.jpg" alt=""></button><span class="num">07</span></figure>
      <figure class="photo"><button><img src="assets/08.jpg" alt=""></button><span class="num">08</span></figure>
      <figure class="photo"><button><img src="assets/09.jpg" alt=""></button><span class="num">09</span></figure>
      <figure class="photo"><button><img src="assets/10.jpg" alt=""></button><span class="num">10</span></figure>
      <figure class="photo"><button><img src="assets/11.jpg" alt=""></button><span class="num">11</span></figure>
      <figure class="photo"><button><img src="assets/12.jpg" alt=""></button><span class="num">12</span></figure>
      <figure class="photo"><button><img src="assets/13.jpg" alt=""></button><span class="num">13</span></figure>
    </main>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="close" id="close" aria-label="Close">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const cards = [...document.querySelectorAll('.photo')];

    function resizeMasonryItem(item){
      if (window.innerWidth <= 650) {
        item.style.gridRowEnd = '';
        return;
      }
      const styles = getComputedStyle(gallery);
      const row = parseInt(styles.getPropertyValue('grid-auto-rows'));
      const gap = parseInt(styles.getPropertyValue('row-gap')) || 0;
      const height = item.getBoundingClientRect().height;
      const span = Math.ceil((height + gap) / (row + gap));
      item.style.gridRowEnd = 'span ' + span;
    }

    function resizeAll(){
      cards.forEach(resizeMasonryItem);
    }

    document.querySelectorAll('.photo img').forEach(img => {
      if (img.complete) {
        requestAnimationFrame(resizeAll);
      } else {
        img.addEventListener('load', resizeAll, { once:true });
      }
    });

    window.addEventListener('load', resizeAll);
    window.addEventListener('resize', resizeAll);

    const box = document.getElementById('lightbox');
    const boxImage = document.getElementById('lightboxImage');
    const close = document.getElementById('close');

    document.querySelectorAll('.photo img').forEach(img => {
      img.parentElement.addEventListener('click', () => {
        boxImage.src = img.src;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeBox(){
      box.classList.remove('open');
      boxImage.src = '';
      document.body.style.overflow = '';
    }

    close.addEventListener('click', closeBox);

    box.addEventListener('click', e => {
      if (e.target === box) closeBox();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeBox();
    });
  </script>

</body>
</html>
